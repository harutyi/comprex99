<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>案件管理 | Comprex99</title><link rel="stylesheet" href="/web/order/order.css"><link rel="stylesheet" href="./projects.css?v=20260923-projects"></head><body>
<header><a href="/web/">Comprex99</a><strong>案件管理</strong><button id="logout" class="secondary" hidden>ログアウト</button></header><main>
<form id="login"><h1>案件管理</h1><label>管理キー<input id="key" type="password" autocomplete="off" required></label><button>案件を読み込む</button></form><p id="message" role="status" aria-live="polite"></p>
<div id="workspace" hidden><div id="listView"><div class="page-heading"><h1>案件一覧</h1><button id="refresh" class="secondary">更新</button><span id="updated" class="note"></span></div><dl id="summary" class="summary"></dl>
<div class="filters"><label>店舗・顧客を検索<input id="search" type="search" placeholder="店舗名・氏名・メール"></label><label>状態<select id="statusFilter"><option value="">すべて</option><option>情報待ち</option><option>制作待ち</option><option>制作中</option><option>顧客確認待ち</option><option>修正中</option><option>納品待ち</option><option>納品済み</option><option>キャンセル</option><option>決済待ち</option></select></label><label>納品予定<select id="dueFilter"><option value="">すべて</option><option value="week">今後7日間</option><option value="overdue">期限超過</option><option value="unset">予定日未設定</option></select></label><span id="count" class="note"></span></div>
<div class="table-wrap" role="region" aria-label="案件一覧" tabindex="0"><table><thead><tr><th>会社・店舗名</th><th>顧客名</th><th>購入プラン</th><th>制作料金</th><th>月額サイト管理</th><th>決済</th><th>状態</th><th>制作情報</th><th>素材</th><th>受付日時</th><th>納品予定日</th></tr></thead><tbody id="rows"></tbody></table></div><div id="unmatched"></div></div><div id="detail" hidden></div></div></main>
<script src="/web/order/plans.js"></script><script src="./model.js?v=20260923-projects"></script><script src="./projects.js?v=20260923-projects"></script></body></html>
