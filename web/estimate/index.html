<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>料金チェックシート | Comprex99</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/web/estimate/estimate.css?v=20260913-site-management" />
  </head>
  <body data-theme="lime">
    <div class="cursor" id="cursor"></div>
    <main class="estimate-shell">
      <section class="estimate-head reveal">
        <a href="/web/">Comprex99</a>
        <p>料金チェックシート</p>
        <h1>必要な内容を選んで、<span>制作費の目安を確認できます。</span></h1>
        <span>細かい追加料金を積み上げるための画面ではありません。内容を確認したうえで、着手前に正式な料金をご案内します。</span>
      </section>

      <form id="estimateForm" class="estimate-form">
        <input type="text" name="company_url" class="hp" tabindex="-1" autocomplete="off" />

        <section class="panel reveal">
          <p class="step-label">1. 業種を選ぶ</p>
          <div class="choice-grid" id="industryChoices"></div>
        </section>

        <section class="panel reveal">
          <p class="step-label">2. 公開後の管理を選ぶ</p>
          <div class="plan-grid" id="maintenanceChoices"></div>
          <div class="fee-link" id="productionFeeNote"></div>
        </section>

        <section class="panel reveal">
          <p class="step-label">3. やりたいことを選ぶ</p>
          <div class="option-list" id="optionChoices"></div>
          <label class="field">
            <span>その他のご要望（自由記入）</span>
            <textarea name="otherRequest" rows="4" placeholder="例：秋限定メニューを載せたい、予約はLINEに飛ばしたい、写真はあとで送る、など"></textarea>
          </label>
        </section>

        <section class="panel contact-panel reveal">
          <p class="step-label">4. 連絡先</p>
          <label class="field"><span>店名</span><input name="shopName" required /></label>
          <label class="field"><span>お名前</span><input name="personName" required /></label>
          <label class="field"><span>電話番号</span><input name="phone" inputmode="tel" required /></label>
          <label class="field"><span>メールアドレス</span><input name="email" type="email" required /></label>
        </section>

        <button class="submit-button" type="submit">見積りを送信する</button>
        <p class="form-message" id="formMessage"></p>
      </form>
    </main>

    <aside class="total-bar" aria-live="polite">
      <div><span>制作費 目安</span><strong id="initialTotal">0円</strong></div>
      <div><span>月額</span><strong id="monthlyTotal">0円</strong></div>
      <small>※追加制作や複雑な機能は内容確認後にご案内します。この画面だけでは契約は成立しません。</small>
    </aside>

    <script src="/web/catalog.js?v=20260913-site-management"></script>
    <script src="/web/estimate/estimate.js?v=20260913-site-management"></script>
    <script src="/site-shell.js"></script>
  </body>
</html>
